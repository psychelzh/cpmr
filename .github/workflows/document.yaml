# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    paths: ["R/**"]

name: document.yaml

concurrency:
  group: document-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  document:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: roxygen2

      - name: Generate and push documentation
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"

          worktree=""
          cleanup() {
            if [[ -n "$worktree" ]]; then
              git worktree remove --force "$worktree" || true
            fi
          }
          trap cleanup EXIT

          for attempt in 1 2 3; do
            git fetch origin "refs/heads/$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME"
            worktree="$(mktemp -d)"
            git worktree add --detach "$worktree" "refs/remotes/origin/$BRANCH_NAME"
            (cd "$worktree" && Rscript -e 'roxygen2::roxygenise()')
            git -C "$worktree" add -- man/ NAMESPACE DESCRIPTION

            if git -C "$worktree" diff --cached --quiet; then
              echo "Documentation is up to date."
              exit 0
            fi

            git -C "$worktree" commit -m "Update documentation"
            if git -C "$worktree" push origin "HEAD:refs/heads/$BRANCH_NAME"; then
              exit 0
            fi

            echo "Documentation push failed; regenerating from the latest branch tip (attempt $attempt/3)."
            git worktree remove --force "$worktree"
            worktree=""
          done

          echo "Unable to push generated documentation after 3 attempts." >&2
          exit 1
